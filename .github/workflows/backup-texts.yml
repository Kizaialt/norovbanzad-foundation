# Copies every member-edited text into the "content-backups" branch, several times a day, so the
# edits exist outside the database too. Each run that finds changes adds one commit, which means
# every earlier version stays recoverable from git history. Reads the public database only; needs
# no secrets. Run it on demand from the Actions tab ("Run workflow").
name: Back up edited texts

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-texts

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site (for the backup script)
        uses: actions/checkout@v4

      - name: Check out the backups branch
        uses: actions/checkout@v4
        with:
          ref: content-backups
          path: backup

      - name: Read the database
        run: python3 tools/backup-texts.py backup/texts.json

      - name: Commit if anything changed
        working-directory: backup
        run: |
          git config user.name "texts-backup"
          git config user.email "texts-backup@users.noreply.github.com"
          git add texts.json
          if git diff --cached --quiet; then
            echo "No changes since the last backup."
          else
            git commit -m "Texts backup $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin content-backups
          fi
